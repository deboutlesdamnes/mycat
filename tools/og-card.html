<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MyCat link preview card</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;600;700&display=swap">
<style>
  /* Colors and fonts are copied from site/styles.css (light theme) so the
     card matches the site: --color-bg, --color-text, --color-accent. */
  :root {
    --bg: #f5f8fb;
    --surface: #ffffff;
    --text: #16212b;
    --accent: #1668c9;
    --divider: color-mix(in srgb, #16212b 32%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif; }

  /* 1200x630 is the size every unfurler expects. */
  .card {
    width: 1200px; height: 630px; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    border-bottom: 10px solid var(--accent);
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 84px; height: 84px; flex: none; }
  .wordmark { font-size: 62px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .wordmark span { color: var(--accent); }

  h1 {
    font-family: "IBM Plex Serif", Georgia, serif; font-weight: 600;
    font-size: 66px; line-height: 1.1; letter-spacing: -.015em; margin: 0 0 22px;
    max-width: 17ch;
  }
  p { font-size: 30px; line-height: 1.45; margin: 0; max-width: 30ch; opacity: .72; }

  .foot { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 27px; font-weight: 600; color: var(--accent); }
  .pills { display: flex; gap: 12px; }
  .pill {
    font-size: 23px; padding: 9px 20px; background: var(--surface);
    border: 1px solid var(--divider); color: var(--text); opacity: .85;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <!-- The mycat mark, matching mycatMark() in site/icons.js. currentColor is
         resolved to the light-theme ink here since there is no app shell. -->
    <svg viewBox="0 0 64 64" fill="none" color="#16212b" aria-hidden="true">
      <path d="M13 10 C15.5 15.2 20 18.6 25.5 20.2 C29.4 18 34.6 18 38.5 20.2 C44 18.6 48.5 15.2 51 10 C54 17.5 54.2 28 51.5 35.2 C49 44 41 48.6 32 48.6 C23 48.6 15 44 12.5 35.2 C9.8 28 10 17.5 13 10 Z" fill="#ffffff" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="13" cy="9" r="4.5" fill="currentColor"/>
      <circle cx="51" cy="9" r="4.5" fill="currentColor"/>
      <path d="M32 48.5 C32 54 36 56.5 40 57" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="46.5" cy="57" r="5.5" stroke="currentColor" stroke-width="4.5"/>
      <circle cx="24.5" cy="30.5" r="2.8" fill="currentColor"/>
      <circle cx="39.5" cy="30.5" r="2.8" fill="currentColor"/>
      <ellipse cx="32" cy="35.6" rx="2.7" ry="2.2" fill="#f0879e"/>
      <path d="M32 37.8 L32 39.1 M32 39.1 C30.9 41.3 28.6 41.1 27.8 39.4 M32 39.1 C33.1 41.3 35.4 41.1 36.2 39.4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21.5 34.6 L15.8 33.2 M21.5 37.4 L16.2 39.2 M42.5 34.6 L48.2 33.2 M42.5 37.4 L47.8 39.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="wordmark">my<span>cat</span></div>
  </div>

  <div>
    <h1>MCAT practice that adapts to you</h1>
    <p>Adaptive questions, spaced-repetition flashcards, and full-length exams.</p>
  </div>

  <div class="foot">
    <div class="pills">
      <div class="pill">Practice</div>
      <div class="pill">Flashcards</div>
      <div class="pill">Full-lengths</div>
    </div>
    <div class="url">mycat.study</div>
  </div>
</div>
</body>
</html>
